[build]
base = "frontend"
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# vue-router usa history mode: sin esto, refrescar una ruta como /catalogo
# devolvería 404 en Netlify en vez de servir la SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
