<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El favicon.svg morado es un genérico de plantilla, sin relación con
         DNV; el ícono real de la PWA (pestaña, instalación, apple-touch) sale
         de /public/icons: por ahora solo una "D" mayúscula ámbar sobre
         negro, como placeholder simple hasta que haya un archivo del logo
         oficial disponible. -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#111315" />
    <!-- Sin maximum-scale ni user-scalable=no (accesibilidad: el usuario puede
         hacer zoom). Los input/select/textarea están en 16px o más para que
         iOS no haga zoom automático al enfocarlos. interactive-widget hace
         que en Android el teclado reduzca el área visible en vez de taparla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Android/Chrome instala directo desde el manifest.webmanifest (que
         genera vite-plugin-pwa), pero iOS/Safari todavía necesita estas
         etiquetas clásicas para abrir "Agregar a inicio" en modo standalone
         (sin barra de Safari) y usar el apple-touch-icon como ícono. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DNV" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit es la tipografía del Sistema. Plus Jakarta Sans es la del módulo
         RDC, que conserva su interfaz original porque los supervisores ya la
         tienen aprendida; solo se aplica dentro de ese módulo. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>DNV — Sistema de Control</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
